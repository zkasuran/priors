[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "priors"
version = "0.1.0"
description = "An agent that turns every outcome into a verifiable prior that changes its next decision. Memory (Sibyl) is the spine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zkasuran", email = "zkasuran@proton.me" }]
dependencies = [
  "sibyl-memory-client>=0.6.1",
  "web3>=6.0",
  "eth-account>=0.10",
]

[project.optional-dependencies]
rationale = ["anthropic>=0.40"]
serve = ["fastapi>=0.110", "uvicorn>=0.30"]
dev = ["pytest>=8.0"]

[project.scripts]
priors = "priors.cli:main"

[tool.setuptools]
packages = ["priors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
